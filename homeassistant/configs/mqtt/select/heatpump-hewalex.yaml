- name: Tap Water Sensor
# This parameter decides about the location of control for heated up utility
# water temperature. Changing temperature sensor (T2 or T3) somehow
# allows controlling the HUW volume (T3 is installed higher, therefore water in
# upper part will have appropriate temperature, in case of control with the T2
# the whole tank should have temperature as required by the controller). In
# case if the tank sensors get damaged, it is possible to switch to temperature
# sensor T7 (that is at heat pump outlet). In this case circulating pump will
# activate each time after cooling down of water tube in heat pump. The
# compressor will switch on after 1 min. if T7 temperature does not increase
# due to the heat of water from the tank.
  command_topic: heatpump/hewalex/Command/TapWaterSensor
  state_topic: heatpump/hewalex/TapWaterSensor
  unique_id: heatpump_hewalex_tapwatersensor
  options:
    - T2
    - T3
    - T7
  command_template: >-
    {% if value == "T2" %}
        0
    {% elif value == "T3" %}
        1
    {% elif value == "T7" %}
        2
    {% else %}
       -1
    {% endif %}
  value_template: >-
    {% if value == "0" %}
        T2
    {% elif value == "1" %}
        T3
    {% elif value == "2" %}
        T7
    {% else %}
       None
    {% endif %}
  icon: mdi:thermometer-water
  device:
    name: Hewalex Heatpump
    identifiers:
    - heatpump_hewalex
- name: Fan Operation Mode
# This option allows changing fan rotational speed. 3 operation options
# are available:
# 1) MAX. - fan works at highest output (ca. 500 m3/h). This allows
# obtaining best equipment operation results, because higher air volume
# is pumped through evaporator. If ambient temperature (T1) exceeds
# 24°C, the fan will automatically slow down (higher heat volume in the
# air).
# 2) MIN. - fan works at highest output (ca. 350 m3/h). Heat pump
# operation efficiency at the same temperature of air drawn into heat pump is lower compared to fan output at MAX. If ambient
# temperature (T1) drops under 10°C, the fan will automatically switch to higher speed.
# 3) DAY/NIGHT - in this setting, between 6 a.m. and 10 p.m. the fan works at maximum speed, and at night its output is lower. The fan
# working at lower speed generates less noise.
  command_topic: heatpump/hewalex/Command/FanOperationMode
  state_topic: heatpump/hewalex/FanOperationMode
  unique_id: heatpump_hewalex_fanoperationmode
  options:
    - Max
    - Min
    - Day/Night
  command_template: >-
    {% if value == "Max" %}
        0
    {% elif value == "Min" %}
        1
    {% elif value == "Day/Night" %}
        2
    {% else %}
       -1
    {% endif %}
  value_template: >-
    {% if value == "0" %}
        Min
    {% elif value == "1" %}
        Max
    {% elif value == "2" %}
        Day/Night
    {% else %}
       None
    {% endif %}
  icon: mdi:fan-clock
  device:
    name: Hewalex Heatpump
    identifiers:
    - heatpump_hewalex
