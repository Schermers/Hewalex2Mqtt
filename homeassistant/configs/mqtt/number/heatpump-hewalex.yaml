- name: Defrosting cycle start-up delay
# Defrosting process functioning has been described in chapter
# Evaporator defrosting mode (Manual: installation-service part).
# Defrosting cycle start-up delay function allows setting time within
# interval: 30-90min. If there is no delay, below temperature activating
# defrosting heat pump would be continuously in defrosting mode.
  command_topic: heatpump/hewalex/Command/DefrostingInterval
  state_topic: heatpump/hewalex/DefrostingInterval
  unit_of_measurement: min
  unique_id: heatpump_hewalex_defrostinginterval_set
  icon: mdi:restart
  min: 30
  max: 90
  device:
    name: Hewalex Heatpump
    identifiers:
    - heatpump_hewalex
- name: Defrosting Start Temp
# The temperature initiating defrosting indicates to heat pump
# automatics that ice has appeared in the evaporator, which results in
# worse heat reception by cooling medium. Defrosting will start only
# when the following conditions are satisfied: evaporator temperature is
# lower than temperature activating defrosting process, then after delay
# time recheck whether the temperature in the evaporator is lower than
# the temperature activating defrosting.
  command_topic: heatpump/hewalex/Command/DefrostingStartTemp
  state_topic: heatpump/hewalex/DefrostingStartTemp
  unit_of_measurement: °C
  min: -30
  max: 0
  unique_id: heatpump_hewalex_defrostingstarttemp_set
  device_class: temperature
  icon: mdi:snowflake-melt
  device:
    name: Hewalex Heatpump
    identifiers:
    - heatpump_hewalex
- name: Defrosting Stop Temp
# If temperature in the evaporator increases above the setting in this
# parameter, defrosting will end and heat pump will return to normal
# operation.
  command_topic: heatpump/hewalex/Command/DefrostingStopTemp
  state_topic: heatpump/hewalex/DefrostingStopTemp
  unit_of_measurement: °C
  min: 2
  max: 30
  unique_id: heatpump_hewalex_defrostingstoptemp_set
  device_class: temperature
  icon: mdi:snowflake-melt
  device:
    name: Hewalex Heatpump
    identifiers:
    - heatpump_hewalex
- name: Defrosting Max Time (min)
# Defrosting duration is the second parameter. Should it be exceeded,
# the pump will also return to normal operation (it is enough if one of
# the two conditions is satisfied).
# IMPORTANT!
# Modification of defrosting parameters by a person, who does not
# know the problem of heat pumps operation very well, may result in
# deteriorated unit operation efficiency
  command_topic: heatpump/hewalex/Command/DefrostingMaxTime
  state_topic: heatpump/hewalex/DefrostingMaxTime
  unit_of_measurement: min
  min: 1
  max: 12
  unique_id: heatpump_hewalex_defrostingmaxtime_set
  icon: mdi:clock-end
  device:
    name: Hewalex Heatpump
    identifiers:
    - heatpump_hewalex
