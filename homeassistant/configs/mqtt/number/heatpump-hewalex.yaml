- name: "Heatpump Set Hysteresis"
# Heat pump start-up hysteresis is one of additional parameters appearing
# after logging in at service level. It is temperature drop in relation to preset
# HUW temperature for heat pump, which restarts the unit. For example, if
# required water temperature is 50°C and hysteresis is 5°C, then at the
# moment when temperature sensor readout shows 45°C, the pump will
# start working until the temperature of 50°C is reached. Setting change is
# possible within 2 to 10°C, however it must be done with care so as to
# ensure comfort of use and correct unit operation.
  command_topic: "heatpump/hewalex/Command/TapWaterHysteresis"
  state_topic: "heatpump/hewalex/TapWaterHysteresis"
  unit_of_measurement: "°C"
  min: 2
  max: 10
  unique_id: hewalex_heatpump_hysteresis_set
  device_class: temperature
  icon: mdi:thermometer
  device:
    identifiers:
      - "heatpump_hewalex"
    name: "Heatpump Hewalex"
