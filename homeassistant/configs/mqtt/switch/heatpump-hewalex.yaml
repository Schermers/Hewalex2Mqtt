- name: "Anti-freezing"
# It is a protection against the occurrence of sub-zero temperature in room,
# where heat pump is installed. In case of too low temperature indicated by
# the T6 sensor, circulating pump will switch on and start pumping water
# between the tank and heat pump, so as to avoid pipeline or condenser
# defrosting.
  command_topic: "heatpump/hewalex/Command/AntiFreezingEnabled"
  state_topic: "heatpump/hewalex/AntiFreezingEnabled"
  payload_on: "True"
  payload_off: "False"
  state_on: "True"
  state_off: "False"
  unique_id: hewalex_heatpump_antifreezing_switch
  icon: mdi:snowflake-off
  device:
    identifiers:
      - "heatpump_hewalex"
    name: "Hewalex Heatpump"
- name: Heater E Enabled
# External control unit
# Depending on the selected diagram, we are able to define, which
# appliances are to be operated by the external control unit. For
# example, if we set heat pump deactivation to NO, even after bridge
# opening the heat pump will be working in compliance with the factory
# controller.
  command_topic: heatpump/hewalex/Command/HeaterEEnabled
  state_topic: heatpump/hewalex/HeaterEEnabled
  payload_on: "True"
  payload_off: "False"
  state_on: "True"
  state_off: "False"
  unique_id: heatpump_hewalex_heatereenabled
  device:
    name: Hewalex Heatpump
    identifiers:
    - heatpump_hewalex
